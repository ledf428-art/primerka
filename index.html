<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Опросник минут на 10: что тебе ближе в работе с нейросетями. Правильных ответов нет.">

<meta property="og:description" content="Опросник минут на 10: что тебе ближе в работе с нейросетями. Правильных ответов нет.">
<title>Примерка нейросетей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bona+Nova:wght@400;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Раскладка: одна колонка по левому краю (до 34rem), сверху закреплена «сантиметровая лента»
   с делением на каждый вопрос, на экране один вопрос. Смелое место одно: лента. */
:root {
  --bg: #EEF0F5;        /* холодная меловая бумага */
  --surface: #FFFFFF;
  --ink: #1B2037;       /* тёмно-синие чернила */
  --muted: #5A6079;
  --line: #CBD0DF;
  --tape: #FFD23F;      /* жёлтая сантиметровая лента */
  --tape-ink: #2B2400;
  --chalk: #B5305A;     /* портновский мел: мелкие пометки */
  --pick-bg: #1B2037;
  --pick-fg: #FFFFFF;
  --font-display: 'Bona Nova', Georgia, 'Times New Roman', serif;
  --font-ui: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151826; --surface: #1F2336; --ink: #ECEEF6; --muted: #A2A9C0; --line: #363C55;
    --tape: #FFD23F; --tape-ink: #2B2400; --chalk: #F0809E; --pick-bg: #ECEEF6; --pick-fg: #151826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151826; --surface: #1F2336; --ink: #ECEEF6; --muted: #A2A9C0; --line: #363C55;
  --tape: #FFD23F; --tape-ink: #2B2400; --chalk: #F0809E; --pick-bg: #ECEEF6; --pick-fg: #151826;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1.0625rem;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

.app {
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 3rem;
}

/* ---------- Шапка с лентой ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-block: 0.75rem 0.875rem;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 2.25rem; }
.back {
  border: 0; background: none; padding: 0.375rem 0.5rem 0.375rem 0; cursor: pointer;
  color: var(--muted); font-weight: 500; font-size: 0.9375rem;
}
.back:hover { color: var(--ink); }
.count { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }

.tape { position: relative; height: 1.625rem; border-radius: 3px; overflow: hidden; background: var(--surface); }
.tape-layer { position: absolute; inset: 0; }
.tape-rest { color: var(--line); }
.tape-rest b { color: var(--muted); }
.tape-fill {
  background: var(--tape); color: var(--tape-ink);
  clip-path: inset(0 calc(100% - var(--p, 0) * 1%) 0 0);
  transition: clip-path 0.35s ease;
}
.tape-layer i {            /* деление: одно на вопрос */
  position: absolute; bottom: 0; width: 1px; height: 0.375rem; background: currentColor;
}
.tape-layer i.five { height: 0.6875rem; width: 1.5px; }
.tape-layer b {            /* цифра на каждом пятом */
  position: absolute; top: 0.125rem; transform: translateX(-50%);
  font-size: 0.625rem; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums;
}

/* ---------- Сцена ---------- */
.stage { padding-block: 1.25rem 0; }
.screen { display: flex; flex-direction: column; gap: 1.25rem; }
.screen.fwd { animation: from-right 0.26s ease both; }
.screen.back-dir { animation: from-left 0.26s ease both; }
@keyframes from-right { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes from-left  { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .screen.fwd, .screen.back-dir { animation: none; }
  .tape-fill { transition: none; }
}

h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.12; }
h1 { font-size: clamp(2.25rem, 9vw, 3rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.875rem, 7vw, 2.375rem); }
p { margin: 0; }
.lead { font-size: 1.125rem; max-width: 30rem; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

.part { color: var(--chalk); font-weight: 600; font-size: 0.9375rem; }
.stitch { border: 0; border-top: 2px dashed var(--line); margin: 0; }

.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.facts li { padding-left: 1.5rem; position: relative; }
.facts li::before {
  content: ""; position: absolute; left: 0; top: 0.5em; width: 0.875rem; height: 0.3125rem;
  background: var(--tape); border-radius: 1px;
}

.field { display: flex; flex-direction: column; gap: 0.375rem; }
.field label { font-weight: 500; }
.input, .area {
  width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 0.8125rem 0.9375rem; font-size: 1.0625rem;
}
.area { min-height: 8.5rem; resize: vertical; line-height: 1.45; display: block; }
.input:focus, .area:focus { border-color: var(--ink); outline: none; }
.input:focus-visible, .area:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.counter { align-self: flex-end; font-variant-numeric: tabular-nums; }

/* ---------- Вопрос ---------- */
.q-sec { color: var(--muted); font-size: 0.875rem; font-weight: 500; }
.q-text { font-family: var(--font-display); font-weight: 400; font-size: 1.5625rem; line-height: 1.25; margin: 0; text-wrap: pretty; }
.q-text.long { font-size: 1.3125rem; line-height: 1.32; }
.q-head { display: flex; flex-direction: column; gap: 0.5rem; }
.q-prompt { font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 0.5rem; }
.opt {
  display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 0.8125rem 0.9375rem; min-height: 3.25rem; line-height: 1.35;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
.opt:hover { border-color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--pick-bg); border-color: var(--pick-bg); color: var(--pick-fg); }
.opt-label { flex: 1; min-width: 0; }
.box {                     /* флажок у вопросов с несколькими ответами */
  flex: none; width: 1.25rem; height: 1.25rem; border-radius: 4px; border: 1.5px solid var(--muted);
  display: grid; place-items: center;
}
.opt[aria-pressed="true"] .box { background: var(--tape); border-color: var(--tape); }
.opt[aria-pressed="true"] .box::after {
  content: ""; width: 0.625rem; height: 0.3125rem; margin-top: -0.125rem;
  border-left: 2px solid var(--tape-ink); border-bottom: 2px solid var(--tape-ink); transform: rotate(-45deg);
}
.meter { flex: none; display: flex; align-items: flex-end; gap: 2px; height: 1.125rem; }
.meter span { width: 4px; border-radius: 1px; background: var(--line); }
.meter span.on { background: var(--tape); }
.opt:not([aria-pressed="true"]) .meter span.on { background: var(--ink); }

.actions { display: flex; flex-wrap: wrap; gap: 0.625rem; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none;
  cursor: pointer; border-radius: 10px; border: 1.5px solid var(--pick-bg);
  background: var(--pick-bg); color: var(--pick-fg);
  padding: 0.8125rem 1.375rem; min-height: 3.25rem; font-weight: 600; font-size: 1.0625rem;
}
.btn:hover { opacity: 0.9; }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.quiet:hover { border-color: var(--ink); opacity: 1; }
.btn.wide { width: 100%; }
.linkish { border: 0; background: none; padding: 0.375rem 0; cursor: pointer; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.linkish:hover { color: var(--ink); }

/* ---------- Финал ---------- */
.send { display: flex; flex-direction: column; gap: 0.625rem; }
.status { min-height: 1.5em; font-weight: 500; }
.status.err { color: var(--chalk); }
.msg { min-height: 9rem; font-size: 0.875rem; word-break: break-all; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top" hidden>
    <div class="top-row">
      <button type="button" class="back" id="back">Назад</button>
      <span class="count" id="count"></span>
    </div>
    <div class="tape" id="tape" role="progressbar" aria-label="Пройдено вопросов" aria-valuemin="0">
      <div class="tape-layer tape-rest" id="tape-rest"></div>
      <div class="tape-layer tape-fill" id="tape-fill"></div>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<script>/* Общая часть опросника и разбора: вопросы, шкалы, кодирование ответов.
   Подключается и в браузере (window.NS), и в Node (module.exports). */
(function (root) {
  'use strict';

  var VERSION = 1;
  var PREFIX = 'NS' + VERSION;

  /* Семь склонностей. В основе модель Холланда (RIASEC): «художественный» тип
     разделён на визуальный и словесный, «реалистичный» переведён в цифровую
     «мастерскую». */
  var TRAITS = {
    vis:    { name: 'Визуал',     desc: 'глаз и вкус: картинка, цвет, как это выглядит' },
    word:   { name: 'Слово',      desc: 'тексты, смыслы, точные формулировки' },
    people: { name: 'Люди',       desc: 'общаться, объяснять, помогать' },
    biz:    { name: 'Дело',       desc: 'продавать, договариваться, запускать своё' },
    order:  { name: 'Порядок',    desc: 'системы и процессы, чтобы работало как часы' },
    dig:    { name: 'Разбор',     desc: 'докопаться до сути, проверить, найти ошибку' },
    make:   { name: 'Мастерская', desc: 'собрать, настроить, заставить технику работать' }
  };

  /* В тексте заставок {q} заменяется на «5 вопросов», {t} на «16 задач» */
  var SECTIONS = {
    warm: { title: 'Разминка',
            note: '{q} о том, где ты сейчас.' },
    like: { title: 'Что тебе по душе',
            note: '{q} про обычную жизнь. Выбирай то, что ближе, даже если подходит несколько вариантов.' },
    how:  { title: 'Как тебе удобнее',
            note: '{q} о том, как тебе нравится работать. Хороших и плохих ответов здесь нет: кому-то нужна тишина, кому-то люди.' },
    'try': { title: 'Примерка',
            note: 'Теперь {t}, которые люди уже делают с нейросетями. Уметь это не нужно. Просто отметь, насколько хочется попробовать.' },
    cond: { title: 'Условия',
            note: 'Немного практики: время, техника, деньги. От этого зависит, с чего удобнее начинать.' },
    own:  { title: 'Своими словами',
            note: 'Последние {q}. Хватит пары предложений.' }
  };

  var SCALE = [
    { v: 1, t: 'Совсем не хочется' },
    { v: 2, t: 'Скорее нет' },
    { v: 3, t: 'Не знаю' },
    { v: 4, t: 'Интересно' },
    { v: 5, t: 'Очень хочется попробовать' }
  ];
  var SCALE_PROMPT = 'Насколько хочется попробовать?';

  var QUESTIONS = [
    /* ---------- Разминка ---------- */
    { id: 'exp', sec: 'warm', type: 'single',
      text: 'Насколько ты уже знакома с нейросетями?',
      options: [
        { t: 'Ни разу не пробовала' },
        { t: 'Пробовала пару раз из любопытства' },
        { t: 'Иногда пользуюсь для своих задач' },
        { t: 'Пользуюсь почти каждый день' }
      ] },
    { id: 'goal', sec: 'warm', type: 'single',
      text: 'Чего ты хочешь от нейросетей в первую очередь?',
      options: [
        { t: 'Новую профессию, чтобы уйти с нынешней работы' },
        { t: 'Подработку к основной работе' },
        { t: 'Делать свою нынешнюю работу легче и лучше' },
        { t: 'Свой проект или своё дело' },
        { t: 'Пока просто интересно, а дальше посмотрю' }
      ] },
    { id: 'like_now', sec: 'warm', type: 'single',
      text: 'Что в нынешней работе тебе нравится больше всего?',
      options: [
        { t: 'Общение с людьми' },
        { t: 'Когда получается красиво и качественно' },
        { t: 'Понятные задачи и порядок' },
        { t: 'Самостоятельность: сама решаю, как делать' },
        { t: 'Стабильность и деньги' },
        { t: 'Пожалуй, ничего' }
      ] },
    { id: 'tired_now', sec: 'warm', type: 'single',
      text: 'А от чего ты устаёшь сильнее всего?',
      options: [
        { t: 'От постоянного общения с людьми' },
        { t: 'От однообразия' },
        { t: 'От суеты и неразберихи' },
        { t: 'От того, что усилий много, а платят мало' },
        { t: 'От чужих правил и графика' },
        { t: 'От физической нагрузки' }
      ] },
    { id: 'o_now', sec: 'warm', type: 'text',
      text: 'Чем ты сейчас занимаешься? В какой сфере разбираешься изнутри?',
      ph: 'Например: пять лет работаю администратором в стоматологии' },

    /* ---------- Что тебе по душе ----------
       Семь бытовых ситуаций по четыре варианта. Каждая склонность встречается
       ровно в четырёх ситуациях, каждая пара склонностей сравнивается дважды
       (сбалансированный план 7-4-2). Порядок вариантов перемешивается. */
    { id: 'cafe', sec: 'like', type: 'single', shuffle: true,
      text: 'Подруга открывает маленькую кофейню и просит помочь. За что возьмёшься с удовольствием?',
      options: [
        { t: 'Придумаю, как всё будет выглядеть: вывеска, меню, оформление', w: { vis: 1 } },
        { t: 'Буду встречать гостей и учить персонал', w: { people: 1 } },
        { t: 'Налажу порядок: закупки, графики, таблицу расходов', w: { order: 1 } },
        { t: 'Сделаю страницу с меню и онлайн-заказом', w: { make: 1 } }
      ] },
    { id: 'evening', sec: 'like', type: 'single', shuffle: true,
      text: 'Свободный вечер, и можно выбрать только одно занятие. Что выберешь?',
      options: [
        { t: 'Писать: пост, историю, длинное письмо', w: { word: 1 } },
        { t: 'Встретиться с человеком и помочь ему разобраться с его вопросом', w: { people: 1 } },
        { t: 'Разгадывать головоломки, искать ошибки, сверять детали', w: { dig: 1 } },
        { t: 'Копаться в новой программе, пока она не заработает как надо', w: { make: 1 } }
      ] },
    { id: 'ask', sec: 'like', type: 'single', shuffle: true,
      text: 'Знакомые просят о помощи. На какую просьбу ты откликнешься с наибольшим удовольствием?',
      options: [
        { t: '«Помоги выбрать и оформить, у тебя вкус»', w: { vis: 1 } },
        { t: '«Выслушай и посоветуй, с тобой легко»', w: { people: 1 } },
        { t: '«Поговори за меня, ты умеешь договариваться»', w: { biz: 1 } },
        { t: '«Проверь, всё ли тут правильно, ты внимательная»', w: { dig: 1 } }
      ] },
    { id: 'joy', sec: 'like', type: 'single', shuffle: true,
      text: 'Что сильнее всего радует тебя в конце рабочего дня?',
      options: [
        { t: 'Я хорошо заработала или заключила сделку', w: { biz: 1 } },
        { t: 'Всё прошло по плану, ничего не потерялось', w: { order: 1 } },
        { t: 'Я докопалась до причины и нашла ошибку', w: { dig: 1 } },
        { t: 'Я сделала вещь, которой утром ещё не было', w: { make: 1 } }
      ] },
    { id: 'explain', sec: 'like', type: 'single', shuffle: true,
      text: 'Как тебе больше нравится объяснять что-то сложное?',
      options: [
        { t: 'Рисую схему или показываю картинку', w: { vis: 1 } },
        { t: 'Рассказываю историю или пример из жизни', w: { word: 1 } },
        { t: 'Раскладываю по шагам: первое, второе, третье', w: { order: 1 } },
        { t: 'Сначала сама докапываюсь до сути, потом говорю главное в двух фразах', w: { dig: 1 } }
      ] },
    { id: 'fair', sec: 'like', type: 'single', shuffle: true,
      text: 'Вы с подругами затеяли благотворительную ярмарку. Что возьмёшь на себя?',
      options: [
        { t: 'Напишу объявление и посты, чтобы люди захотели прийти', w: { word: 1 } },
        { t: 'Буду на месте: встречать гостей, помогать, отвечать на вопросы', w: { people: 1 } },
        { t: 'Найду спонсоров и уговорю участников', w: { biz: 1 } },
        { t: 'Составлю план, списки и расписание, чтобы ничего не забыли', w: { order: 1 } }
      ] },
    { id: 'gift', sec: 'like', type: 'single', shuffle: true,
      text: 'Тебе дарят месяц свободного времени на свой проект. Что это будет?',
      options: [
        { t: 'Что-то красивое: серия фотографий, видео, оформление', w: { vis: 1 } },
        { t: 'Блог, рассказы или сценарий', w: { word: 1 } },
        { t: 'Маленький бизнес, который начнёт приносить деньги', w: { biz: 1 } },
        { t: 'Свой сайт, приложение или полезный инструмент', w: { make: 1 } }
      ] },

    /* ---------- Как тебе удобнее: предпочтения, которые сдвигают оценку направлений ---------- */
    { id: 'people', sec: 'how', type: 'single',
      text: 'Сколько общения с людьми ты хочешь в новом деле по сравнению с нынешней работой?',
      options: [
        { t: 'Больше: общение меня заряжает' },
        { t: 'Примерно столько же' },
        { t: 'Меньше: хочется больше тишины' },
        { t: 'Почти без общения' }
      ] },
    { id: 'broken', sec: 'how', type: 'single',
      text: 'В телефоне или в приложении что-то не работает, и непонятно почему. Многих это злит, и это нормально. А ты?',
      options: [
        { t: 'Мне даже интересно: пробую разные варианты, пока не получится' },
        { t: 'Ищу инструкцию или видео и делаю по шагам' },

    function begin(pos) {
      state.name = nameInput.value.trim();
      if (!state.startedAt) state.startedAt = Date.now();
      go(pos, 'fwd');
    }
    var hasProgress = saved && answeredCount() > 0 && resumePos > 0;

    screen.appendChild(el('h1', { text: 'Примерка нейросетей', 'data-head': true }));
    screen.appendChild(el('p', { 'class': 'lead',
      text: 'Нейросети — это не одна профессия, а десяток разных занятий. Кому-то ближе картинки и видео, кому-то тексты, кому-то боты и автоматизация. Здесь можно прикинуть, что из этого подойдёт тебе.' }));
    screen.appendChild(el('ul', { 'class': 'facts' }, [
      el('li', { text: TOTAL + ' ' + plural(TOTAL, 'вопрос', 'вопроса', 'вопросов') + ', около ' + MINUTES + ' минут. Можно прерваться и вернуться: ответы сохраняются.' }),
      el('li', { text: 'Знать что-то о нейросетях не нужно.' }),
      el('li', { text: 'Правильных ответов нет. Отвечай как есть, а не как «надо», тогда результат будет про тебя.' })
    ]));
    screen.appendChild(el('hr', { 'class': 'stitch' }));
    screen.appendChild(el('div', { 'class': 'field' }, [
      el('label', { 'for': 'name', text: 'Как тебя зовут?' }),
      nameInput
    ]));
    if (hasProgress) {
      var n = answeredCount();
      screen.appendChild(el('div', { 'class': 'actions' }, [
        el('button', { type: 'button', 'class': 'btn', text: 'Продолжить', onclick: function () { begin(resumePos); } }),
        el('button', { type: 'button', 'class': 'btn quiet', text: 'Начать заново', onclick: function () {
          var keep = nameInput.value;
          state = blank(); state.name = keep; saved = null; resumePos = 0; save(); begin(1);
        } })
      ]));
      screen.appendChild(el('p', { 'class': 'muted small',
        text: 'Ты уже ответила на ' + n + ' ' + plural(n, 'вопрос', 'вопроса', 'вопросов') + ' из ' + TOTAL + '.' }));
    } else {
      screen.appendChild(el('div', { 'class': 'actions' }, [
        el('button', { type: 'button', 'class': 'btn', text: 'Начать', onclick: function () { begin(1); } })
      ]));
    }
    screen.appendChild(el('p', { 'class': 'muted small',
      text: 'В конце ты отправишь ответы тому, кто дал тебе этот опросник, и вы вместе разберёте, с чего начать. До этого ответы остаются только на твоём устройстве.' }));
  }

  function renderSection(screen, step) {
    var sec = NS.SECTIONS[step.sec];
    screen.appendChild(el('p', { 'class': 'part', text: 'Часть ' + step.no + ' из ' + secIds.length }));
    screen.appendChild(el('h2', { text: sec.title, 'data-head': true }));
    screen.appendChild(el('hr', { 'class': 'stitch' }));
    var note = sectionNote(step.sec);
    screen.appendChild(el('p', { 'class': 'lead', text: note.charAt(0).toUpperCase() + note.slice(1) }));
    screen.appendChild(el('div', { 'class': 'actions' }, [
      el('button', { type: 'button', 'class': 'btn', text: 'Дальше', onclick: next })
    ]));
  }

  function renderQuestion(screen, step) {
    var q = step.q;
    var value = state.answers[q.id];
    var headKids = [el('p', { 'class': 'q-sec', text: NS.SECTIONS[q.sec].title })];
    var title = el('h2', { 'class': 'q-text' + (q.text.length > 105 ? ' long' : ''), text: q.text, 'data-head': true });
    headKids.push(title);
    if (q.type === 'scale') headKids.push(el('p', { 'class': 'q-prompt', text: NS.SCALE_PROMPT }));
    if (q.hint) headKids.push(el('p', { 'class': 'muted small', text: q.hint }));
    screen.appendChild(el('div', { 'class': 'q-head' }, headKids));

    if (q.type === 'single' || q.type === 'scale') {
      var items = q.type === 'single'
        ? q.options.map(function (o, i) { return { v: i, t: o.t }; })
        : NS.SCALE.map(function (s) { return { v: s.v, t: s.t, meter: s.v }; });
      if (q.shuffle) items = shuffled(items.length, q.id).map(function (i) { return items[i]; });
      var list = el('div', { 'class': 'opts' });
      var buttons = [];
      items.forEach(function (it) {
        var kids = [];
        if (it.meter) {
          var meter = el('span', { 'class': 'meter', 'aria-hidden': 'true' });
          for (var k = 1; k <= 5; k++) {
            var bar = el('span', { 'class': k <= it.meter ? 'on' : '' });
            bar.style.height = (4 + k * 2.8) + 'px';
            meter.appendChild(bar);
          }
          kids.push(meter);
        }
        kids.push(el('span', { 'class': 'opt-label', text: it.t }));
        var b = el('button', { type: 'button', 'class': 'opt', 'aria-pressed': value === it.v ? 'true' : 'false' }, kids);
        b.addEventListener('click', function () {
          state.answers[q.id] = it.v;
          save();
          buttons.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
          if (pending) window.clearTimeout(pending);
          pending = window.setTimeout(function () { pending = null; next(); }, 260);
        });
        buttons.push(b);
        list.appendChild(b);
      });
      screen.appendChild(list);
      if (NS.isAnswered(q, value)) {
        screen.appendChild(el('div', { 'class': 'actions' }, [
          el('button', { type: 'button', 'class': 'btn', text: 'Дальше', onclick: next })
        ]));
      }
    } else if (q.type === 'multi') {
      var picked = Array.isArray(value) ? value.slice() : [];
      var mlist = el('div', { 'class': 'opts' });
      var mbuttons = [];
      var nextBtn = el('button', { type: 'button', 'class': 'btn', text: 'Дальше', onclick: next });
      function sync() {
        mbuttons.forEach(function (b, i) { b.setAttribute('aria-pressed', picked.indexOf(i) >= 0 ? 'true' : 'false'); });
        nextBtn.disabled = picked.length === 0;
        if (picked.length) state.answers[q.id] = picked.slice(); else delete state.answers[q.id];
        save();
      }
      q.options.forEach(function (o, i) {
        var b = el('button', { type: 'button', 'class': 'opt' }, [
          el('span', { 'class': 'box', 'aria-hidden': 'true' }),
          el('span', { 'class': 'opt-label', text: o.t })
        ]);
        b.addEventListener('click', function () {
          var at = picked.indexOf(i);
          if (at >= 0) picked.splice(at, 1);
          else if (o.solo) picked = [i];
          else {
            picked = picked.filter(function (j) { return !q.options[j].solo; });
            picked.push(i);
            while (picked.length > q.max) picked.shift();   /* сверх лимита снимаем самый ранний выбор */
          }
          sync();
        });
        mbuttons.push(b);
        mlist.appendChild(b);
      });
      screen.appendChild(mlist);
      screen.appendChild(el('div', { 'class': 'actions' }, [nextBtn]));
      sync();
    } else {
      var area = el('textarea', { 'class': 'area', id: 'answer-' + q.id, maxlength: String(NS.TEXT_MAX),
        placeholder: q.ph || '', 'aria-label': q.text });
      area.value = typeof value === 'string' ? value : '';
      var counter = el('span', { 'class': 'counter muted small' });
      var goBtn = el('button', { type: 'button', 'class': 'btn', onclick: next });
      function syncText() {
        var v = area.value;
        if (v.trim()) state.answers[q.id] = v; else delete state.answers[q.id];
        counter.textContent = v.length + ' из ' + NS.TEXT_MAX;
        goBtn.textContent = v.trim() ? 'Дальше' : 'Пропустить';
        save();
      }
      area.addEventListener('input', syncText);
      screen.appendChild(el('div', { 'class': 'field' }, [area, counter]));
      screen.appendChild(el('div', { 'class': 'actions' }, [goBtn]));
      syncText();
    }
  }

  function renderFinish(screen) {
    var gap = firstGap();
    if (gap >= 0) {
      screen.appendChild(el('h2', { text: 'Остался вопрос без ответа', 'data-head': true }));
      screen.appendChild(el('p', { 'class': 'lead', text: 'Без него картина будет неполной. Это быстро.' }));
      screen.appendChild(el('div', { 'class': 'actions' }, [
        el('button', { type: 'button', 'class': 'btn', text: 'Ответить', onclick: function () { go(gap, 'back'); } })
      ]));
      return;
    }

    var code = NS.encode(state);
    var name = (state.name || '').trim();
    var message = 'Мои ответы на опросник про нейросети' + (name ? '\nИмя: ' + name : '') + '\n\nКод ответов:\n' + code;

    var status = el('p', { 'class': 'status', role: 'status', 'aria-live': 'polite' });
    var box = el('textarea', { 'class': 'area msg', id: 'message', readonly: true, 'aria-label': 'Сообщение с ответами' });
    box.value = message;
    function say(text, isErr) { status.textContent = text; status.className = 'status' + (isErr ? ' err' : ''); }
    function selectBox() { box.focus(); box.select(); try { box.setSelectionRange(0, message.length); } catch (e) { /* не везде есть */ } }
    function copied() { say('Скопировано. Открой чат и вставь сообщение.'); }
    function copyFailed() { selectBox(); say('Не получилось скопировать автоматически. Текст ниже выделен: скопируй его вручную.', true); }
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(message).then(copied, function () { legacyCopy(); });
      } else legacyCopy();
    }
    function legacyCopy() {
      selectBox();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) copied(); else copyFailed();
    }

    screen.appendChild(el('h2', { text: 'Готово, спасибо!', 'data-head': true }));
    screen.appendChild(el('p', { 'class': 'lead',
      text: 'Осталось отправить ответы тому, кто дал тебе этот опросник. Вместе вы разберёте, с чего тебе лучше начать.' }));
    screen.appendChild(el('hr', { 'class': 'stitch' }));

    var send = el('div', { 'class': 'send' });
    var canShare = !inFrame && typeof navigator.share === 'function';
    if (canShare) {
      send.appendChild(el('button', { type: 'button', 'class': 'btn wide', text: 'Отправить ответы', onclick: function () {
        navigator.share({ text: message }).then(function () { say('Сообщение передано в выбранное приложение.'); },
          function (err) { if (!err || err.name !== 'AbortError') copy(); });
      } }));
    }
    send.appendChild(el('button', { type: 'button', 'class': 'btn wide' + (canShare ? ' quiet' : ''), text: 'Скопировать ответы', onclick: copy }));
    send.appendChild(el('a', { 'class': 'btn quiet wide', target: '_blank', rel: 'noopener',
      href: 'https://t.me/share/url?url=' + encodeURIComponent(code) + '&text=' + encodeURIComponent('Мои ответы на опросник про нейросети' + (name ? ', ' + name : '')),
      text: 'Открыть Telegram' }));
    send.appendChild(el('a', { 'class': 'btn quiet wide', target: '_blank', rel: 'noopener',
      href: 'https://wa.me/?text=' + encodeURIComponent(message), text: 'Открыть WhatsApp' }));
    if (!inFrame) {
      send.appendChild(el('button', { type: 'button', 'class': 'btn quiet wide', text: 'Скачать файлом', onclick: function () {
        try {
          var blob = new Blob([message + '\n'], { type: 'text/plain;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = el('a', { href: url, download: 'otvety-neiroseti.txt' });
          document.body.appendChild(a); a.click(); a.remove();
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
          say('Файл сохранён. Отправь его в чат.');
        } catch (e) { copyFailed(); }
      } }));
    }
    screen.appendChild(send);
    screen.appendChild(status);
    screen.appendChild(el('div', { 'class': 'field' }, [
      el('label', { 'for': 'message', 'class': 'muted small', text: 'Это сообщение уйдёт в чат. Длинная строка в конце — твои ответы в сжатом виде.' }),
      box
    ]));
    screen.appendChild(el('button', { type: 'button', 'class': 'linkish', text: 'Вернуться и поправить ответы', onclick: prev }));
  }

  render();
})();
</script>
</body>
</html>
